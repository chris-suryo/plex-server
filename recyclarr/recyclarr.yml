# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
#
# Syncs TRaSH Guides quality settings into Sonarr and Radarr so they grab good
# releases and skip junk (fakes, low quality, bloated encodes). Built from the
# official Recyclarr v8 templates:
#   Sonarr: web-1080p     https://trash-guides.info/Sonarr/sonarr-setup-quality-profiles/#web-1080p
#   Radarr: hd-bluray-web https://trash-guides.info/Radarr/radarr-setup-quality-profiles/#hd-bluray-web
#
# 1080p is deliberate: it direct-plays almost everywhere, keeps files small, and
# is cheap to transcode for friends streaming remotely.
#
# Recyclarr syncs daily on its own. Force a sync with:
#   docker compose run --rm recyclarr sync
# API keys come from .env (SONARR_API_KEY / RADARR_API_KEY).

sonarr:
  web-1080p:
    base_url: http://sonarr:8989
    api_key: !env_var SONARR_API_KEY

    quality_definition:
      type: series

    quality_profiles:
      - trash_id: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
        reset_unmatched_scores:
          enabled: true

    custom_format_groups:
      add:
        - trash_id: 158188097a58d7687dee647e04af0da3 # [Optional] Golden Rule HD
        - trash_id: 74aff4168620ed49dcc67e92b2c2a5b4 # [Optional] Language Profiles
        - trash_id: 85fae4a2294965b75710ef2989c850eb # [Streaming Services] HD/UHD boost
        - trash_id: 59c3af66780d08332fdc64e68297098f # [Unwanted] Unwanted Formats

radarr:
  hd-bluray-web:
    base_url: http://radarr:7878
    api_key: !env_var RADARR_API_KEY

    quality_definition:
      type: movie

    quality_profiles:
      - trash_id: d1d67249d3890e49bc12e275d989a7e9 # HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true

    custom_format_groups:
      add:
        - trash_id: f8bf8eab4617f12dfdbd16303d8da245 # [Optional] Golden Rule HD
        - trash_id: a3ac6af01d78e4f21fcb75f601ac96df # [Unwanted] Unwanted Formats
